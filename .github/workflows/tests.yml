name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tesseract (OCR) met Nederlands
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-nld
      - name: Python-pakketten
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q tests
